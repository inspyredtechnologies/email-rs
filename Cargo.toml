[package]
name = "outlook-rs"
version = "0.1.4"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
directories = "6.0.0"
eframe = "0.36.2"
getrandom = "0.4.3"
html2text = "0.17.3"
iana-time-zone = "0.1.65"
imap = "2.4.1"
keyring = { version = "3", features = ["windows-native"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "native-tls", "builder", "hostname"] }
mail-parser = "0.11.9"
native-tls = "0.2.18"
open = "5.4.4"
png = "0.18.1"
rfd = "0.17.2"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.4.2", features = ["json"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Time"] }
wry = "0.57.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
